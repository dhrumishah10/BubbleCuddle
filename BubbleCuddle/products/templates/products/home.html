<!DOCTYPE html>
<html>
<head>
<title>Products</title>

<style>

body{
    font-family: Arial;
    background:#f5f5f5;
}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}

.card{
    width:300px;
    background:white;
    margin:20px;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
}

.name{
    font-size:20px;
    font-weight:bold;
    color:#333;
}

.desc{
    color:#666;
    margin-top:10px;
}

.price{
    color:green;
    font-size:22px;
    margin-top:15px;
    font-weight:bold;
}

</style>
</head>

<body>

<h1 style="text-align:center;">Our Products</h1>

<div class="container">

{% for pro in prod %}

<div class="card">

<div class="name">{{pro.name}}</div>

<div class="desc">{{pro.desc}}</div>

<div class="price">₹ {{pro.price}}</div>

</div>

{% endfor %}

</div>

</body>
</html>
